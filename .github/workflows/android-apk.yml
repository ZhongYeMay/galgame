name: Build Android APK - full original visual novel

on:
  push:
    branches: [android-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using preinstalled sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check latest original game and bridges
        shell: bash
        run: |
          node android/verify-source.cjs
          git diff --exit-code origin/main -- site/
      - name: Build complete Android x64/arm64-compatible debug APK
        shell: bash
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify packed game contains complete original UI and AI bridges
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          for name in index.html game.js story.js style.css android-bridge.js desktop-ai.js; do
            unzip -Z1 "$APK" | grep -qx "assets/$name"
          done
          for name in studio coast bookshop mio-0 mio-1 mio-2 nagi-0 nagi-1 nagi-2 shiori-0 shiori-1 shiori-2; do
            unzip -Z1 "$APK" | grep -qx "assets/assets/retro/$name.webp"
          done
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^package:|^launchable-activity:|^sdkVersion:"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee android-apk-sha256.txt
          cp "$APK" MayosSummer-Android-Complete-DualMode.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MayosSummer-Android-APK
          path: |
            MayosSummer-Android-Complete-DualMode.apk
            android-apk-sha256.txt
          retention-days: 30
