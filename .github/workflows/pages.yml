name: Deploy visual novel to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check site/story.js
          node --check site/game.js
          node --check site/online-ai.js
          node --check site/character-voice.js
          node --check site/fish-voice.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload game and AI artwork
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
