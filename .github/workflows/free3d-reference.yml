name: Free Stable Fast 3D reference model experiment

# External free ZeroGPU service currently returns an opaque upstream error.
# Manual-only: never auto-consume quota, and never imply that a model exists.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-reference-3d
  cancel-in-progress: false

jobs:
  generate-one-character-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client for official public Stable Fast 3D Space
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'gradio_client>=1.6,<2' 'Pillow>=10,<13'
      - name: Generate Nagi 3D draft using free Stable Fast 3D ZeroGPU (one request only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python native3d/tools/free_stable_fast3d.py \
            --source site/assets/retro/nagi-0.webp \
            --output free3d/nagi_sf3d_draft.glb
      - name: Save GLB and validation report only when real generation succeeds
        uses: actions/upload-artifact@v4
        with:
          name: Nagi-StableFast3D-Free-UNREVIEWED-GLB
          path: |
            free3d/nagi_sf3d_draft.glb
            free3d/nagi_sf3d_draft.review.json
          if-no-files-found: error
          retention-days: 7
