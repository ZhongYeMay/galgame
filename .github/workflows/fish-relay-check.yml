name: Validate Fish relay CORS and missing-key protection
on:
  push:
    branches: [main]
    paths: [.github/workflows/fish-relay-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Validate public endpoint, CORS and rejecting requests without user keys
        shell: bash
        run: |
          set -euo pipefail
          url="https://uaxnhmaczwjldvjhcysk.supabase.co/functions/v1/mayos-fish-tts"
          origin="https://zhongyemay.github.io"
          status=$(curl -sS -D /tmp/get-headers -o /tmp/get-body -w '%{http_code}' \
            --max-time 20 -H "Origin: $origin" "$url")
          echo "GET: $status"
          test "$status" = "200"
          grep -q 's2.1-pro-free' /tmp/get-body
          status=$(curl -sS -D /tmp/options-headers -o /tmp/options-body -w '%{http_code}' \
            --max-time 20 -X OPTIONS -H "Origin: $origin" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" "$url")
          echo "OPTIONS: $status"
          test "$status" = "204"
          grep -qi 'access-control-allow-origin: https://zhongyemay.github.io' /tmp/options-headers
          status=$(curl -sS -o /tmp/error-body -w '%{http_code}' --max-time 20 -X POST \
            -H "Origin: $origin" -H "Content-Type: application/json" \
            -d '{"key":"","text":"你好","route":"mio"}' "$url")
          echo "POST without key: $status"
          test "$status" = "400"
          grep -q 'Fish' /tmp/error-body
          echo "Fish relay basic contract verified without user credentials"
